<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Panel Lateral Apps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-base: #120e1c;
      --bg-surface: #1a1429;
      --bg-surface-hover: #241c38;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #a855f7;
      --primary: #7c3aed;
      --primary-hover: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      contain: layout style;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR */
    #bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      background: rgba(18, 14, 28, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
      flex-shrink: 0;
      min-height: 52px;
      contain: content;
    }

    #bar-apps {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      padding: 2px 0;
      contain: content;
    }
    #bar-apps::-webkit-scrollbar { display: none; }

    .app-tab {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      background: var(--bg-surface);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transform: translateZ(0);
      transition: transform 0.18s var(--ease-spring),
                  box-shadow 0.18s var(--ease-spring),
                  border-color 0.18s ease;
      contain: layout style;
    }
    .app-tab svg, .app-tab .emoji-icon {
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
      transition: transform 0.18s var(--ease-spring);
      pointer-events: none;
    }
    .app-tab:hover {
      transform: translateY(-2px) scale(1.06) translateZ(0);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .app-tab:hover svg {
      transform: scale(1.1);
    }
    .app-tab:active {
      transform: translateY(0) scale(0.92) translateZ(0);
      transition-duration: 0.06s;
    }
    .app-tab.on {
      box-shadow: 0 0 0 2px var(--border-focus), 0 4px 14px var(--primary-glow);
      transform: translateY(-1px) translateZ(0);
    }
    .app-tab.on::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      border-radius: 4px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      box-shadow: 0 0 8px #a855f7;
    }

    .bar-divider {
      width: 1px;
      height: 22px;
      background: var(--border-subtle);
      margin: 0 2px;
      flex-shrink: 0;
    }

    #bar .sp {
      flex: 1;
    }

    .bar-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.18s var(--ease-spring),
                  background 0.18s ease,
                  color 0.18s ease,
                  border-color 0.18s ease;
    }
    .action-btn:hover {
      color: #fff;
      background: var(--bg-surface-hover);
      border-color: var(--border-subtle);
      transform: translateY(-1px) translateZ(0);
    }
    .action-btn:active {
      transform: scale(0.92) translateZ(0);
      transition-duration: 0.06s;
    }
    .action-btn.settings:hover svg {
      transform: rotate(45deg);
      transition: transform 0.28s ease;
    }
    .action-btn.external:hover svg {
      transform: translate(1px, -1px);
      transition: transform 0.18s ease;
    }
    .action-btn.close:hover {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* ESCENARIO / CONTENEDOR */
    #stage {
      flex: 1;
      position: relative;
      background: var(--bg-base);
      overflow: hidden;
      contain: layout style;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg-base);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateZ(0);
      will-change: opacity;
      transition: opacity 0.18s var(--ease-spring), visibility 0.18s;
    }
    iframe.on {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* PANTALLA DE BIENVENIDA / DASHBOARD */
    #hint {
      position: absolute;
      inset: 0;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-surface-hover) transparent;
      animation: fadeIn 0.25s var(--ease-spring);
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 20%, #c4b5fd 70%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .welcome-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .quick-grid-title {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      width: 100%;
      margin-bottom: 24px;
      contain: content;
    }

    .quick-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.18s var(--ease-spring),
                  background 0.18s ease,
                  border-color 0.18s ease,
                  box-shadow 0.18s ease;
      text-align: left;
    }
    .quick-card:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px) translateZ(0);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .quick-card:active {
      transform: scale(0.96) translateZ(0);
      transition-duration: 0.06s;
    }
    .quick-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .quick-info {
      flex: 1;
      min-width: 0;
    }
    .quick-info b {
      display: block;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-info small {
      font-size: 11px;
      color: var(--text-dim);
    }

    .tips-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .tips-box b {
      color: #e2e8f0;
    }
    .tips-box kbd {
      background: var(--bg-surface-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      color: #cbd5e1;
      font-family: inherit;
    }

    /* MODAL GESTIONAR APPS */
    #manage {
      position: absolute;
      inset: 0;
      background: rgba(18, 14, 28, 0.98);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow-y: auto;
      padding: 18px 16px 24px;
      box-sizing: border-box;
      z-index: 50;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-surface-hover) transparent;
      animation: slideUp 0.22s var(--ease-spring);
    }

    .manage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .manage-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .manage-close {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .manage-close:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .sec-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin: 16px 0 10px;
    }

    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      contain: content;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      transform: translateZ(0);
      transition: transform 0.18s var(--ease-spring), border-color 0.18s ease;
    }
    .row:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateX(2px) translateZ(0);
    }
    .row .ic {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .row .nm {
      flex: 1;
      min-width: 0;
    }
    .row .nm b {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #fff;
    }
    .popup-badge {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }
    .row .nm small {
      color: var(--text-muted);
      font-size: 11px;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }
    .row .del-btn {
      border: 1px solid rgba(239, 68, 68, 0.2);
      background: rgba(239, 68, 68, 0.08);
      color: #f87171;
      border-radius: 8px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(0);
      transition: all 0.18s var(--ease-spring);
    }
    .row .del-btn:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      transform: scale(1.08) translateZ(0);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }
    .row .del-btn:active {
      transform: scale(0.92) translateZ(0);
      transition-duration: 0.06s;
    }

    /* PRESETS */
    .presets-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .preset-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transform: translateZ(0);
      transition: all 0.18s var(--ease-spring);
    }
    .preset-pill:hover {
      background: var(--bg-surface-hover);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px) translateZ(0);
    }
    .preset-pill:active {
      transform: scale(0.95) translateZ(0);
      transition-duration: 0.06s;
    }

    /* FORMULARIO AGREGAR */
    form {
      display: grid;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 14px;
      border-radius: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type=text], input[type=url] {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--bg-base);
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    input[type=text]:focus, input[type=url]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
    }

    .r2 {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type=color] {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: none;
      padding: 2px;
      cursor: pointer;
    }

    /* SWITCH TOGGLE */
    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      margin: 4px 0;
      user-select: none;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg-surface-hover);
      border: 1px solid var(--border-subtle);
      transition: .2s var(--ease-spring);
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: .2s var(--ease-spring);
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
      border-color: var(--primary-hover);
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }

    #msg {
      font-size: 12px;
      color: #fca5a5;
      min-height: 14px;
      transition: opacity 0.18s ease;
    }

    .btn-submit {
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary) 0%, #9333ea 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transform: translateZ(0);
      transition: all 0.18s var(--ease-spring);
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, #a855f7 100%);
      transform: translateY(-1px) translateZ(0);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.6);
    }
    .btn-submit:active {
      transform: scale(0.97) translateZ(0);
      transition-duration: 0.06s;
    }

    .manage-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .ghost-btn {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transform: translateZ(0);
      transition: all 0.18s var(--ease-spring);
    }
    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .ghost-btn.primary {
      background: rgba(124, 58, 237, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }
    .ghost-btn.primary:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate3d(0, 4px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="bar-apps"></div>
    <div class="bar-divider"></div>
    <div class="sp"></div>
    <div class="bar-actions">
      <button class="action-btn settings" id="btn-manage" title="Gestionar aplicaciones"></button>
      <button class="action-btn external" id="btn-external" title="Abrir app actual en nueva pestaña"></button>
      <button class="action-btn close" id="btn-close" title="Cerrar panel lateral"></button>
    </div>
  </div>

  <div id="stage">
    <div id="hint"></div>
    <div id="manage"></div>
  </div>

  <script src="apps.js"></script>
  <script src="panel.js"></script>
</body>
</html>
